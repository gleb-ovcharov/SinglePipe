[project]
name = "singlepipe"
version = "0.0.1"
description = "Typed interface for ML model inference across HuggingFace, PyTorch, and other backends"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gleb", email = "glebov274@gmail.com" },
]
keywords = ["ml", "inference", "huggingface", "pytorch", "pydantic", "typed"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The core: schemas, validation, images. No ML backend here — each backend is an
# extra, so a user who only needs one backend does not download the others.
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pydantic>=2.13.4",
    "numpy>=2.0",
]

[project.optional-dependencies]
# HFAdapter. torch is included: without it transformers cannot load models.
# For a specific CUDA build, install torch from its own index on top.
hf = [
    "transformers>=5.14.1",
    "torch>=2.13.0",
]
# DETR models in transformers use a timm backbone.
detr = [
    "singlepipe[hf]",
    "timm>=1.0.28",
]
# Bare torch, for the planned torch adapter.
torch = [
    "torch>=2.13.0",
]
all = [
    "singlepipe[hf,detr,torch]",
]

[dependency-groups]
dev = [
    "singlepipe[all]",
    "anyio>=4",
    "pytest>=8",
    "ruff>=0.16.1",
    "mypy>=2.3.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["singlepipe*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "A"]
# PEP 695 generics (class X[T]) — отдельное решение: вариантность и поддержка pydantic
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["torch", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "slow: downloads or runs large pretrained models (deselect with -m \"not slow\")",
]